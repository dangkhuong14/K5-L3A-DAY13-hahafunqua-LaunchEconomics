# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (tổng 2.502 yêu cầu).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 1.251 * 2,48 = 3.103 yêu cầu/nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40 nhân viên hiện có: KHÔNG ĐỦ NGƯỜI).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251 -> KHÔNG ĐẠT mức chênh +5 điểm dù chạy lâu đến đâu.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 6 / 0,02 = 300 < 1.251 -> KHÔNG ĐẠT, đồng thời chỉ có 6 cụm (< 20 cụm tối thiểu).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) * 0,02) >= 859 -> m >= 299 yêu cầu/nhân viên (DE = 6,96; tổng 5.980 yêu cầu/nhóm).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng và 20 nhân viên can thiệp xử lý song song trong cùng tuần và cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code có seed chốt trước, phân tầng theo 12 depot để cân bằng đặc thù từng kho.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi câu trả lời của trợ lý; giảm bằng khóa quyền truy cập trợ lý theo staff_id và ghi log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05 được chốt trước ngày khởi chạy pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đạt đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên hiện có, không cách chia theo cụm nào đủ cỡ mẫu cho mức chênh +5 điểm (trần 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên (20 + 20) để bảo đảm tính tách tác động (20 cụm/nhóm) và chấp nhận nâng MDE lên +6 điểm (m >= 299 yêu cầu/nhân viên, DE = 6,96).
#   Con số bất lợi cần báo hội đồng: nếu tác động thật chỉ là +5 điểm thì power của pilot giảm xuống còn khoảng 0,64 (với n hiệu dụng = 859/nhóm).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ mở lại hiện tại trong dữ liệu chạy thử là 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982).
#   Không đặt ngưỡng dừng tuyệt đối 3% vì pilot sẽ bị dừng ngay tuần đầu; thay vào đó dùng ngưỡng tương đối cao hơn nhóm đối chứng >= 2 điểm phần trăm kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên toàn bộ 12 depot; loại quoc_te (22.515 đ = 1,88x, simulated) và doi_tac (10.215 đ = 0,85x, simulated, điều khoản riêng)"
  assignment:
    unit: "staff" # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50] #  4 -> 10 -> 20 nhân viên (mỗi bước tối thiểu 1 tuần); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96 # DE = 1 + (299 - 1) * 0,02 với m = 299 yêu cầu/nhân viên
    clusters_per_arm: 20 # 20 nhân viên mỗi nhóm (tổng 40 nhân viên)
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng và 20 nhân viên can thiệp chạy song song cùng thời điểm tại 12 depot"
    spillover_risk: "Trung bình do nhân viên làm chung depot; giảm thiểu bằng cấp quyền truy cập trợ lý theo tài khoản staff_id và ghi log sự kiện agent_suggestion_shown theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 0,06, 3 luật dừng, hạt giống bốc thăm phân tầng theo depot và ngày quyết định được chốt trước khi chạy pilot"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm phần trăm trở lên hoặc vượt trần 6%, hoặc phát sinh từ 1 ca hoàn tiền trùng lặp trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN tắt cờ trợ lý trong 30 phút để điều tra KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công đo thực tế vượt 8.000 đ (giới hạn an toàn so với mức 12.000 đ tự làm) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi pilot"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% hoặc tỉ lệ mở gợi ý trợ lý dưới 50% ở nhóm can thiệp TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo nguyên nhân gốc cho PM KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn và chi phí; không dừng sớm vì chỉ số chính trước ngày quyết định"
  rollback: "Giám đốc vận hành LogiX-VN tắt feature flag trợ lý toàn hệ thống, hiệu lực trong vòng 30 phút; toàn bộ yêu cầu hoàn phí chuyển ngay về luồng nhân viên CSKH tự xử lý tiêu chuẩn (6 phút/yêu cầu)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công toàn mẫu: 4.472 đ (simulated)"
    - "Chi phí mỗi việc thành công theo loại: noi_dia 2.696 đ (0,22x), hang_nang 8.221 đ (0,69x), quoc_te 22.515 đ (1,88x), doi_tac 10.215 đ (0,85x) (simulated)"
    - "Chi phí mỗi việc thành công phạm vi noi_dia + hang_nang kèm cố định 40 triệu đ/tháng: 4.599 đ (0,38x) ở 45.000 yc/tháng và 5.784 đ (0,48x) ở nửa khối lượng (simulated)"
    - "Chi phí cả hệ thống theo giới hạn chạy lại: tối đa 2 lần rẻ nhất 6.901.220 đ (simulated)"
    - "Kịch bản xem lại 100% phạm vi noi_dia + hang_nang: 11.743 đ (0,98x) với 9 phút làm lại hoặc 12.415 đ (1,03x) với 15,3 phút làm lại (simulated)"
